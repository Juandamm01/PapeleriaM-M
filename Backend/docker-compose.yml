services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: papeleria
      POSTGRES_PASSWORD: papeleria
      POSTGRES_DB: papeleria_mm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papeleria -d papeleria_mm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun x prisma migrate deploy && bun run seed && bun run build && bun dist/main.js"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://papeleria:papeleria@db:5432/papeleria_mm?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backend_node_modules:
